<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1565c0" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
</head>
<body class="gallery-body">
  <main class="container container-wide">
    <header class="header gallery-header">
      <h1>Photo &amp; Video Gallery</h1>
      <p id="gallery-count" class="subtitle">Loading&hellip;</p>
    </header>

    <section id="gallery-status" class="card status-card">
      <p id="status-text">Loading&hellip;</p>
    </section>

    <section id="gallery-sections" class="gallery-sections hidden" aria-label="Photo gallery"></section>

    <nav class="bottom-nav">
      <a href="/" class="link-row">&larr; Send Photos or Videos</a>
    </nav>
  </main>

  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Photo full size">
    <button id="lightbox-close" class="lightbox-close" aria-label="Close">&times;</button>
    <button id="lightbox-prev" class="lightbox-nav lightbox-prev" aria-label="Previous">&#8249;</button>
    <button id="lightbox-next" class="lightbox-nav lightbox-next" aria-label="Next">&#8250;</button>
    <div id="lightbox-counter" class="lightbox-counter"></div>
    <div id="lightbox-media-wrap" class="lightbox-media-wrap"></div>
    <div id="lightbox-info" class="lightbox-info"></div>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
